    location /china {
        alias /usr/share/nginx/html/travels/china/china.html;
    }
    location /china/beijing {
        alias /usr/share/nginx/html/travels/china/beijing.html;
    }
    location /china/shanghai {
        alias /usr/share/nginx/html/travels/china/shanghai.html;
    }
}
