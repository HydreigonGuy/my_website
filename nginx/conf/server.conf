server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location /france {
        alias /usr/share/nginx/html/travels/france/france.html;
    }
    location /france/toulouse {
        alias /usr/share/nginx/html/travels/france/toulouse.html;
    }
}
